name: Bot - On PR Review (Labels)

# Faithful copy of hiero-ledger/hiero-sdk-cpp .github/workflows/on-pr-review-labels.yaml
on:
  workflow_run:
    workflows: ["Bot - On PR Review"]
    types:
      - completed

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

jobs:
  run-bot:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout default branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Helpers BEFORE download (from checkout of default branch)
        run: |
          md5sum .github/scripts/helpers/index.js
          head -3 .github/scripts/helpers/index.js

      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: review-event-${{ github.event.workflow_run.id }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Inspect downloaded files
        run: |
          echo "--- workspace root ---"
          ls -la
          echo "--- review-event.json ---"
          cat review-event.json
          echo "--- helpers AFTER download ---"
          md5sum .github/scripts/helpers/index.js
          head -3 .github/scripts/helpers/index.js

      - name: Run bot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node -e "
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            const bot = require('./.github/scripts/bot-on-pr-review-labels.js');
            bot({
              github: { rest: { pulls: { get: async () => ({ data: { number: 1 } }) },
                                 issues: { addLabels: async () => ({ data: [] }) } } },
              context: { repo: { owner, repo } }
            }).catch(e => console.error('bot error (expected after payload):', e.message));
          "
